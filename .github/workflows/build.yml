name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub Release from this manual build
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag, for example v1.0.4. Leave blank to use CURRENT_VERSION.
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_RELEASE_TAG
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $updater = Get-Content "BE\src\updater.py" -Raw
              if ($updater -notmatch 'CURRENT_VERSION\s*=\s*"([^"]+)"') {
                throw "Could not find CURRENT_VERSION in BE\src\updater.py"
              }
              $tag = "v$($Matches[1].TrimStart('v'))"
            }
          } else {
            $tag = $env:REF_NAME
          }

          if (!$tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create build environment file
        shell: pwsh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN || vars.UPDATER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) { $missing += "DATABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_TOKEN)) { $missing += "UPDATER_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) { $missing += "ANTHROPIC_API_KEY" }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secret(s) or variable(s): $($missing -join ', ')"
          }

          @"
          DATABASE_URL=$env:DATABASE_URL
          GITHUB_TOKEN=$env:UPDATER_TOKEN
          ANTHROPIC_API_KEY=$env:ANTHROPIC_API_KEY
          "@ | Set-Content -Path .env -Encoding UTF8

      - name: Build with PyInstaller
        run: pyinstaller chartwells.spec --clean

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\ChartwellsAutomation\ChartwellsAutomation.exe")) {
            throw "Expected EXE not found at dist\ChartwellsAutomation\ChartwellsAutomation.exe"
          }

      - name: Add runtime environment file
        shell: pwsh
        run: |
          Copy-Item -Path ".env" -Destination "dist\ChartwellsAutomation\.env" -Force

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ChartwellsAutomation" -DestinationPath "ChartwellsAutomation-windows.zip" -Force

      - name: Build legacy one-file updater asset
        shell: pwsh
        run: |
          pyinstaller UI/dashboard.py `
            --name ChartwellsAutomation `
            --onefile `
            --windowed `
            --clean `
            --paths "." `
            --collect-submodules BE `
            --collect-submodules UI.components `
            --add-data ".env;." `
            --add-data "BE/src/cash_sheet_filler/cash_sheet_config.json;BE/src/cash_sheet_filler" `
            --add-data "BE/src/tender_break/tender_config.json;BE/src/tender_break" `
            --add-data "BE/src/cash_sheet_filler/cash_sheet_config.json;config_defaults" `
            --add-data "BE/src/tender_break/tender_config.json;config_defaults" `
            --hidden-import psycopg2 `
            --hidden-import psycopg2._psycopg `
            --hidden-import dotenv `
            --hidden-import tkinter `
            --hidden-import _tkinter `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import win32print `
            --hidden-import win32api `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import UI.components.sidebar `
            --hidden-import UI.components.autofill_center `
            --hidden-import UI.components.autofill_center_runtime `
            --hidden-import UI.components.analyticsPage `
            --hidden-import UI.components.aiChatPage `
            --hidden-import UI.components.summaryPanel `
            --hidden-import UI.components.taskManager `
            --hidden-import UI.components.resizablePane `
            --hidden-import BE.src.cash_sheet_filler.main `
            --hidden-import BE.src.cash_sheet_filler.infor_parser `
            --hidden-import BE.src.cash_sheet_filler.tavlo_parser `
            --hidden-import BE.src.cash_sheet_filler.grubhub_parser `
            --hidden-import BE.src.cash_sheet_filler.excel_autofiller `
            --hidden-import BE.src.cash_sheet_filler.base_parser `
            --hidden-import BE.src.cash_sheet_filler.config `
            --hidden-import BE.src.tender_break.autofill `
            --hidden-import BE.src.tender_break.config `
            --hidden-import BE.src.db.tendersdb_manager `
            --hidden-import BE.src.ai_engine `
            --hidden-import BE.src.updater `
            --hidden-import BE.src.printer `
            --hidden-import BE.src.path_helper `
            --hidden-import BE.src.utils `
            --hidden-import BE.src.cache
          Copy-Item -Path "dist\ChartwellsAutomation.exe" -Destination "ChartwellsAutomation.exe" -Force

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ChartwellsAutomation-windows
          path: |
            ChartwellsAutomation-windows.zip
            ChartwellsAutomation.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ChartwellsAutomation-windows.zip
            ChartwellsAutomation.exe
          overwrite_files: false
          generate_release_notes: true
